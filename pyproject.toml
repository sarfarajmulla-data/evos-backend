[project]
name = "evos-backend"
version = "0.1.0"
description = "EVOS backend for electric vehicle operations and sustainability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.8",
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
